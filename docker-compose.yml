version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: school-id-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_id_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_id_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - school-id-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-id-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-school_id_platform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-school-id-card-platform-jwt-secret-key-must-be-at-least-32-bytes-long!}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      APP_STORAGE_LOCATION: /app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - school-id-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-id-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    restart: unless-stopped
    networks:
      - school-id-net

networks:
  school-id-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
